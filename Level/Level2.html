<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>SoccerIQ - Niveau 2</title>

<style>

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #1A0000;
  color: white;
  text-align: center;
}

.topnav {
  overflow: hidden;
  background-color: #D2042D;
}

.topnav a {
  float: left;
  color: white;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

.topnav a:hover {
  background-color: white;
  color: black;
}

.quizBox {
  background-color: white;
  color: black;
  width: 60%;
  margin: auto;
  padding: 20px;
  border-radius: 15px;
}

button {
  background-color: #D2042D;
  color: white;
  border: none;
  padding: 10px 20px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
  width: 60%;
}

button:hover {
  background-color: #8B0000;
}

#options button {
  margin: 10px;
}

</style>

<script>

let currentQuestion = 0;
let score = 0;

const quizQuestions = [

{
  question: "Le désert du Sahara est situé sur quel continent ?",
  options: ["Europe", "Afrique", "Asie", "Amérique"],
  answer: "Afrique"
},

{
  question: "Le plus grand continent du monde est :",
  options: ["Afrique", "Europe", "Asie", "Océanie"],
  answer: "Asie"
},

{
  question: "Le plus long rivère du monde est :",
  options: ["Amazon", "Mississippi", "Nil", "Yangtsé"],
  answer: "Nil"
},

{
  question: "La Seconde Guerre mondiale s'est terminée en quelle année ?",
  options: ["1939", "1942", "1945", "1950"],
  answer: "1945"
},

{
  question: "Un miroir ______ est un miroir divergent dont la surface réfléchissante est bombée vers la source lumineuse.",
  options: ["Concave", "Plan", "Convexe", "Transparent"],
  answer: "Convexe"
}

];

function startGame() {
  showQuestion();
}

function showQuestion() {

  if(currentQuestion < quizQuestions.length) {

    document.getElementById("question").innerHTML =
      quizQuestions[currentQuestion].question;

    document.getElementById("resultat").innerHTML = "";

let optionsHTML = "";

for(let i = 0; i < quizQuestions[currentQuestion].options.length; i++) {

  let option = quizQuestions[currentQuestion].options[i];

  optionsHTML +=
    "<button onclick=\"verifierReponse('" + option + "')\">" +
    option +
    "</button><br>";
}
    document.getElementById("options").innerHTML =
      optionsHTML;

  } else {

    let message =
      "Ton score final : " +
      score + "/" + quizQuestions.length + "<br><br>";

    if(score == quizQuestions.length) {
      message += " Excellent joueur! Clique sur niveau 4";
    }
    else if(score >= 3) {
      message += " Bon travail! Clique sur niveau 4";
    }
    else {
      message += " Continue à pratiquer! Clique sur niveau 4";
    }

    document.getElementById("quiz").innerHTML =
      "<h2>" + message + "</h2>";
  }
}

function verifierReponse(userAnswer) {

  let correctAnswer =
    quizQuestions[currentQuestion].answer;

  if(userAnswer == correctAnswer) {

    score++;

    document.getElementById("resultat").innerHTML =
      "✅ Bonne réponse!";

    document.getElementById("resultat").style.color =
      "green";

  } else {

    document.getElementById("resultat").innerHTML =
      "Mauvaise réponse! La bonne réponse était : " +
      correctAnswer;

    document.getElementById("resultat").style.color =
      "red";
  }

  currentQuestion++;

  setTimeout(showQuestion, 2000);
}

</script>

</head>

<body onload="startGame()">

<div class="topnav">
  <a href="index.html">Home</a>
  <a href="Level1.html">Niveau 1</a>
  <a href="Level2.html">Niveau 2</a>
  <a href="Level3.html">Niveau 3</a>
</div>

<br>

<h1>SoccerIQ ⚽ Niveau 2 (10e)</h1>

<!-- Logo -->
<img src="Image\SoccerIQlogo.png" width="25%">

<br><br>

<!-- Quiz -->
<div class="quizBox" id="quiz">

  <h2 id="question"></h2>

  <div id="options"></div>

  <h2 id="resultat"></h2>

</div>

<br>

<h2>Faire une pass ⚽</h2>

</body>

</html>
