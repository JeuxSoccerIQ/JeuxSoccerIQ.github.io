<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<title>SoccerIQ - Niveau 3</title>

<style>

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background-color: #1A0000;
  color: white;
  text-align: center;
}

.topnav {
  overflow: hidden;
  background-color: #D2042D;
}

.topnav a {
  float: left;
  color: white;
  padding: 14px 16px;
  text-decoration: none;
  font-size: 17px;
}

.topnav a:hover {
  background-color: white;
  color: black;
}

.quizBox {
  background-color: white;
  color: black;
  width: 60%;
  margin: auto;
  padding: 20px;
  border-radius: 15px;
}

button {
  background-color: #D2042D;
  color: white;
  border: none;
  padding: 10px 20px;
  font-size: 18px;
  border-radius: 10px;
  cursor: pointer;
  width: 60%;
}

button:hover {
  background-color: #8B0000;
}

#options button {
  margin: 10px;
}

</style>

<script>

let currentQuestion = 0;
let score = 0;

const quizQuestions = [

{
  question: "Quel est un exemple de raisonnement inductif ?",
  options: [
    " Démontrer un théorème à l'aide de l'algèbre ",
    "Utiliser des règles connues pour résoudre une équation ",
    "Observer des tendances pour faire une prédiction ",
    "Appliquer une formule directement "
  ],
  answer: "Observer des tendances pour faire une prédiction ",
},

{
  question: "Quelle est la valeur des deux derniers chiffres de 525²?",
  options: ["10", "25", "20", "30"],
  answer: "25"
},

{
  question: "Quel nombre est un nombre premier ?",
  options: ["9", "15", "21", "17"],
  answer: "17"
},

{
  question: "Si un train parcourt 60 km en 1 heure, quelle distance parcourra-t-il en 3 heures ?",
  options: ["180 km", "150 km", "120 km", "240 km"],
  answer: "180 km"
},

{
  question: "Trouve le nombre manquant: 3, 6, 12, 24, __",
  options: ["36", "42", "48", "50"],
  answer: "48"
}

];

function startGame() {
  showQuestion();
}

function showQuestion() {

  if(currentQuestion < quizQuestions.length) {

    document.getElementById("question").innerHTML =
      quizQuestions[currentQuestion].question;

    document.getElementById("resultat").innerHTML = "";

let optionsHTML = "";

for(let i = 0; i < quizQuestions[currentQuestion].options.length; i++) {

  let option = quizQuestions[currentQuestion].options[i];

  optionsHTML +=
    "<button onclick=\"verifierReponse('" + option + "')\">" +
    option +
    "</button><br>";
}
    document.getElementById("options").innerHTML =
      optionsHTML;

  } else {

    let message =
      "Ton score final : " +
      score + "/" + quizQuestions.length + "<br><br>";

    if(score == quizQuestions.length) {
      message += "Excellent joueur! Clique sur niveau 4";
    }
    else if(score >= 3) {
      message += "Bon travail! Clique sur niveau 4";
    }
    else {
      message += "Continue à pratiquer! Clique sur niveau 4";
    }

    document.getElementById("quiz").innerHTML =
      "<h2>" + message + "</h2>";
  }
}

function verifierReponse(userAnswer) {

  let correctAnswer =
    quizQuestions[currentQuestion].answer;

  if(userAnswer == correctAnswer) {

    score++;

    document.getElementById("resultat").innerHTML =
      "✅ Bonne réponse!";

    document.getElementById("resultat").style.color =
      "green";

  } else {

    document.getElementById("resultat").innerHTML =
      " Mauvaise réponse! La bonne réponse était : " +
      correctAnswer;

    document.getElementById("resultat").style.color =
      "red";
  }

  currentQuestion++;

  setTimeout(showQuestion, 2000);
}

</script>

</head>

<body onload="startGame()">

  <h2 id="question"></h2>

  <div id="options"></div>

</div>
